<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银河相册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b1a;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            overflow-y: scroll;
            height: 100vh;
            scroll-behavior: smooth;
        }
        #galaxyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }
        .gallery-content {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px 120px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        .video-stage {
            position: relative;
            width: 100%;
            max-width: 750px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(100,150,255,0.1);
            border: 2px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
            min-height: 200px;
        }

        .video-slide {
            width: 100%;
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .video-slide.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            position: relative;
        }
        .video-stage .video-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }
        .video-stage .video-slide.active {
            position: relative;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 30px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 30px;
        }

        .plane-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 40px;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
            user-select: none;
            letter-spacing: 2px;
        }
        .plane-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        .plane-btn:active {
            transform: scale(0.95);
        }
        .plane-btn .plane-icon {
            display: inline-block;
            transition: transform 0.5s ease;
        }
        .plane-btn.flying .plane-icon {
            transform: translateX(60px) rotate(10deg) scale(1.5);
            transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.4, 1);
        }

        .plane-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .plane-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .plane-overlay .plane {
            position: absolute;
            font-size: 6rem;
            top: 40%;
            left: -120px;
            animation: flyAcross 2s ease-in-out forwards;
            filter: drop-shadow(0 0 30px rgba(255,200,100,0.6));
        }
        @keyframes flyAcross {
            0% { left: -120px; top: 40%; transform: rotate(-5deg) scale(0.8); }
            30% { top: 30%; transform: rotate(0deg) scale(1.2); }
            70% { top: 45%; transform: rotate(5deg) scale(1); }
            100% { left: calc(100% + 120px); top: 35%; transform: rotate(-3deg) scale(1); }
        }

        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 10;
            color: #fff;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            padding: 12px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .back-button:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .gallery-content { padding: 60px 15px 80px; gap: 40px; }
            .video-stage { max-width: 100%; }
            .back-button { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.9rem; }
            .plane-btn { font-size: 1rem; padding: 10px 20px; }
            .plane-overlay .plane { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <canvas id="galaxyCanvas"></canvas>

    <a href="liuxingyu.html" class="back-button">← 回秘密基地</a>

    <div class="gallery-content">
        <div class="video-stage" id="videoStage">
            <!-- 第一个视频 -->
            <div class="video-slide active" data-index="0">
                <div class="video-wrapper">
                    <iframe 
                        src="https://player.bilibili.com/player.html?bvid=BV1jVtt6LEYo&page=1" 
                        scrolling="no" 
                        frameborder="no" 
                        framespacing="0" 
                        allowfullscreen="true">
                    </iframe>
                </div>
            </div>
            <!-- 第二个视频 -->
            <div class="video-slide" data-index="1">
                <div class="video-wrapper">
                    <iframe 
                        src="https://player.bilibili.com/player.html?bvid=BV1jVtt6LErm&page=1" 
                        scrolling="no" 
                        frameborder="no" 
                        framespacing="0" 
                        allowfullscreen="true">
                    </iframe>
                </div>
            </div>
        </div>

        <button class="plane-btn" id="nextBtn">
            <span class="plane-icon">✈️</span> 下一站
        </button>
    </div>

    <div class="plane-overlay" id="planeOverlay">
        <div class="plane">✈️</div>
    </div>

    <script>
        // ================== 银河动画（不变） ==================
        (function() {
            const canvas = document.getElementById('galaxyCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let animationId = null;

            const CONFIG = {
                particleCount: 6000,
                bandWidth: 0.25,
                driftSpeed: 0.3,
                starSizeMin: 0.6,
                starSizeMax: 2.8,
            };

            class Particle {
                constructor() {
                    this.reset(true);
                }
                reset(init = false) {
                    const band = width * CONFIG.bandWidth;
                    this.y = Math.random() * height;
                    let xOffset;
                    if (Math.random() < 0.85) {
                        xOffset = gaussianRandom() * band * 0.4;
                    } else {
                        xOffset = (Math.random() - 0.5) * band * 2.2;
                    }
                    this.x = width / 2 + xOffset;
                    this.size = CONFIG.starSizeMin + Math.random() * (CONFIG.starSizeMax - CONFIG.starSizeMin);
                    this.hue = 200 + Math.random() * 120;
                    this.saturation = 70 + Math.random() * 30;
                    this.lightness = 60 + Math.random() * 35;
                    const distRatio = Math.min(Math.abs(xOffset) / (band * 0.8), 1);
                    this.alpha = (0.6 + 0.4 * (1 - distRatio * distRatio)) * (0.6 + 0.4 * Math.random());
                    this.drift = (Math.random() - 0.5) * 0.6 + 0.2;
                    if (Math.random() < 0.5) this.drift = -this.drift;
                    this.wobble = Math.random() * 0.02;
                    this.phase = Math.random() * Math.PI * 2;
                    this.twinkleSpeed = 0.01 + Math.random() * 0.03;
                    this.twinklePhase = Math.random() * Math.PI * 2;
                }
                update() {
                    this.y += this.drift * CONFIG.driftSpeed;
                    this.x += Math.sin(this.y * this.wobble + this.phase) * 0.08;
                    if (this.y > height + 20) { this.y = -20; this.reset(false); }
                    else if (this.y < -20) { this.y = height + 20; this.reset(false); }
                    if (this.x < -50 || this.x > width + 50) { this.reset(false); }
                }
                draw(time) {
                    const flicker = 0.7 + 0.3 * Math.sin(time * this.twinkleSpeed + this.twinklePhase);
                    const alpha = this.alpha * flicker;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${alpha})`;
                    ctx.fill();
                    if (this.size > 2.0 && Math.random() < 0.02) {
                        ctx.shadowColor = `hsla(${this.hue}, 80%, 70%, 0.3)`;
                        ctx.shadowBlur = 30;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${this.hue}, 70%, 80%, 0.08)`;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            }

            function gaussianRandom() {
                let u = 0, v = 0;
                while (u === 0) u = Math.random();
                while (v === 0) v = Math.random();
                return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < CONFIG.particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            function drawGalaxy(time) {
                ctx.clearRect(0, 0, width, height);
                const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height)/1.2);
                grad.addColorStop(0, '#1a1a3a');
                grad.addColorStop(0.5, '#0f0f2a');
                grad.addColorStop(1, '#050510');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                const band = width * CONFIG.bandWidth;
                const glowGrad = ctx.createLinearGradient(width/2, 0, width/2, height);
                glowGrad.addColorStop(0, 'rgba(100,150,255,0)');
                glowGrad.addColorStop(0.2, 'rgba(100,150,255,0.03)');
                glowGrad.addColorStop(0.5, 'rgba(180,200,255,0.06)');
                glowGrad.addColorStop(0.8, 'rgba(100,150,255,0.03)');
                glowGrad.addColorStop(1, 'rgba(100,150,255,0)');
                ctx.fillStyle = glowGrad;
                ctx.fillRect(width/2 - band*0.4, 0, band*0.8, height);

                for (let p of particles) {
                    p.update();
                    p.draw(time);
                }

                for (let i = 0; i < 120; i++) {
                    const x = Math.random() * width;
                    const y = Math.random() * height;
                    if (Math.abs(x - width/2) < band * 0.5) continue;
                    const size = Math.random() * 1.2 + 0.3;
                    const alpha = Math.random() * 0.3 + 0.1;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.fill();
                }
            }

            function animate(timestamp) {
                const time = timestamp / 1000 || 0;
                drawGalaxy(time);
                animationId = requestAnimationFrame(animate);
            }

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                initParticles();
            }

            window.addEventListener('resize', resize);
            resize();
            animate(0);

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (animationId) cancelAnimationFrame(animationId);
                } else {
                    animate(performance.now());
                }
            });
        })();

        // ================== 视频切换 + 飞机动画 + 刷新 iframe ==================
        (function() {
            const slides = document.querySelectorAll('.video-slide');
            const nextBtn = document.getElementById('nextBtn');
            const planeOverlay = document.getElementById('planeOverlay');
            let currentIndex = 0;
            const total = slides.length;

            // 强制刷新 iframe 的函数（让视频从头播放）
            function refreshIframe(slideElement) {
                const iframe = slideElement.querySelector('iframe');
                if (!iframe) return;
                // 获取原始 src（不含时间戳）
                let src = iframe.src;
                // 如果已经有 _ 参数，去掉旧的时间戳
                src = src.replace(/&_=\d+/g, '');
                // 添加新的时间戳
                const separator = src.includes('?') ? '&' : '?';
                src += separator + '_=' + Date.now();
                iframe.src = src;
            }

            function goToNext() {
                if (currentIndex >= total - 1) {
                    nextBtn.textContent = '🚀 已到终点';
                    nextBtn.disabled = true;
                    return;
                }

                // 1. 触发飞机动画
                planeOverlay.classList.add('active');
                nextBtn.classList.add('flying');

                // 2. 动画结束后切换
                setTimeout(() => {
                    // 隐藏当前
                    slides[currentIndex].classList.remove('active');
                    // 显示下一个
                    currentIndex++;
                    slides[currentIndex].classList.add('active');

                    // ★ 关键：强制刷新新视频的 iframe，使其从头播放
                    refreshIframe(slides[currentIndex]);

                    // 更新按钮状态
                    if (currentIndex === total - 1) {
                        nextBtn.innerHTML = '<span class="plane-icon">🏁</span> 最后一部';
                    } else {
                        nextBtn.innerHTML = '<span class="plane-icon">✈️</span> 下一站';
                    }

                    planeOverlay.classList.remove('active');
                    nextBtn.classList.remove('flying');

                }, 2200);
            }

            nextBtn.addEventListener('click', goToNext);

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    if (!nextBtn.disabled) goToNext();
                }
            });

            // 初始确保第一个激活
            slides.forEach((slide, idx) => {
                if (idx === 0) slide.classList.add('active');
                else slide.classList.remove('active');
            });
        })();
    </script>
</body>
</html>
