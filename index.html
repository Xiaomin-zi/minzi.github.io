<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流星雨 · 秘密基地</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0b0b1a;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            width: 100vw;
        }
        /* ---- 流星雨画布（背景） ---- */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ---- 内容层（视频 + 文字 + 星星按钮） ---- */
        .overlay {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .overlay h1 {
            color: #fff;
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(0,0,0,0.9);
            margin-bottom: 20px;
            pointer-events: none;
        }
        .overlay p {
            color: #fff;
            font-size: 1.2rem;
            opacity: 0.7;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 30px;
            pointer-events: none;
        }

        /* ---- 视频容器（修正） ---- */
        .video-container {
            pointer-events: auto;
            width: 80%;
            max-width: 800px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(255, 200, 100, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            position: relative;
        }
        /* 16:9 宽高比容器，让 iframe 完美填充 */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 20px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 20px;
        }

        /* ---- 星星按钮（右下角） ---- */
        .star-button {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 10;
            pointer-events: auto;
            cursor: pointer;
            font-size: 4rem;
            line-height: 1;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            transition: transform 0.3s ease, text-shadow 0.3s ease;
            animation: twinkle 2s infinite alternate;
            user-select: none;
            text-decoration: none;
        }
        .star-button:hover {
            transform: scale(1.2) rotate(10deg);
            text-shadow: 0 0 60px rgba(255, 215, 0, 1);
        }
        .star-button span {
            display: block;
            font-size: 1rem;
            color: rgba(255,255,255,0.6);
            text-shadow: none;
            margin-top: -10px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        @keyframes twinkle {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* ---- 响应式 ---- */
        @media (max-width: 600px) {
            .overlay h1 { font-size: 2rem; }
            .video-container { width: 95%; }
            .star-button { font-size: 3rem; bottom: 20px; right: 20px; }
        }
    </style>
</head>
<body>

    <!-- 流星雨画布 -->
    <canvas id="meteorCanvas"></canvas>

    <!-- 内容层 -->
    <div class="overlay">
        <h1>🌠 嘿！这是小敏子的秘密基地</h1>
        <p>快看！有流星雨 ✨</p>

        <!-- 视频容器（修正：使用正确的 B站嵌入代码） -->
        <div class="video-container">
            <div class="video-wrapper">
                <iframe 
                    src="https://player.bilibili.com/player.html?bvid=BV1e94Q6GEbF&page=1&high_quality=1&danmaku=0"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <!-- 星星按钮 → 跳转到 yinhe.html -->
    <a href="yinhe.html" class="star-button" title="去银河相册">
        ⭐
    </a>

    <script>
        // ================== 流星雨脚本 ==================
        (function() {
            const canvas = document.getElementById('meteorCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;

            const CONFIG = {
                starCount: 200,
                meteorChance: 0.06,
                meteorSpeedMin: 5,
                meteorSpeedMax: 12,
                meteorTailLength: 250,
                meteorColor: '255, 200, 100',
                angleSpread: 0.09
            };

            let stars = [];
            let meteors = [];

            function init() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;

                stars = [];
                for (let i = 0; i < CONFIG.starCount; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 1.8 + 0.5,
                        alpha: Math.random() * 0.8 + 0.2,
                        twinkleSpeed: Math.random() * 0.02 + 0.01,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            function createMeteor() {
                const startX = width * (0.75 + Math.random() * 0.35);
                const startY = height * (-0.05 + Math.random() * 0.25);
                const baseAngle = 3 * Math.PI / 4;
                const angle = baseAngle + (Math.random() - 0.5) * 2 * CONFIG.angleSpread;
                const speed = CONFIG.meteorSpeedMin + Math.random() * (CONFIG.meteorSpeedMax - CONFIG.meteorSpeedMin);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                return {
                    x: startX, y: startY, vx, vy,
                    length: CONFIG.meteorTailLength,
                    life: 1.0,
                    decay: 0.007 + Math.random() * 0.005
                };
            }

            function updateMeteors() {
                if (Math.random() < CONFIG.meteorChance) {
                    meteors.push(createMeteor());
                }
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.x += m.vx;
                    m.y += m.vy;
                    m.life -= m.decay;
                    if (m.life <= 0 || m.x < -200 || m.y > height + 200) {
                        meteors.splice(i, 1);
                    }
                }
                if (meteors.length > 100) meteors.splice(0, meteors.length - 100);
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height)/1.5);
                grad.addColorStop(0, '#1a1a3a');
                grad.addColorStop(1, '#080816');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                const time = Date.now() / 1000;
                for (let star of stars) {
                    const twinkle = 0.6 + 0.4 * Math.sin(time * star.twinkleSpeed + star.phase);
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha * twinkle})`;
                    ctx.fill();
                }

                for (let m of meteors) {
                    const len = Math.hypot(m.vx, m.vy);
                    if (len === 0) continue;
                    const tailX = m.x - (m.vx / len) * m.length;
                    const tailY = m.y - (m.vy / len) * m.length;
                    const gradient = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
                    const alpha = m.life;
                    gradient.addColorStop(0, `rgba(${CONFIG.meteorColor}, ${alpha})`);
                    gradient.addColorStop(1, `rgba(${CONFIG.meteorColor}, 0)`);
                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(tailX, tailY);
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, 2.5 * m.life, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${CONFIG.meteorColor}, ${m.life * 0.8})`;
                    ctx.shadowColor = `rgba(${CONFIG.meteorColor}, ${m.life * 0.3})`;
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            function animate() {
                updateMeteors();
                draw();
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', init);
            init();
            animate();
        })();
    </script>
</body>
</html>
